name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vite 8 requires ^20.19.0 || >=22.12.0
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vite 8 requires ^20.19.0 || >=22.12.0
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # CI=true (set by GitHub Actions) makes playwright.config start a fresh
      # webServer instead of reusing one, and enables retries/forbidOnly.
      - run: npm run test:e2e
