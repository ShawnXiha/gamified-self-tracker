name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vite 8 requires ^20.19.0 || >=22.12.0
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vite 8 requires ^20.19.0 || >=22.12.0
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Read the Playwright version for the browser cache key
        id: playwright-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      # Browser binaries dominate the e2e job's install time; cache them keyed
      # on the OS and exact Playwright version.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
      # CI=true (set by GitHub Actions) makes playwright.config start a fresh
      # webServer instead of reusing one, and enables retries/forbidOnly.
      # No build step: the webServer runs vite dev against the TS sources.
      - run: npm run test:e2e
      # trace: 'on-first-retry' writes here; upload on success or failure,
      # except when the run is cancelled.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: tests/e2e/test-results/
          retention-days: 7
